<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>MLB · Save the White Christmas · Live scoreboard</title>
<meta property="og:title" content="MLB · Save the White Christmas · Live scoreboard">
<meta property="og:description" content="Clear all 10 stages, post your score card and climb the board.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Public live scoreboard · MLB HK "Save the White Christmas". Reads board.json (written by the team console), refreshes every minute.
   Look: winter-race results sheet — one grotesk (Archivo, tabular figures), sentence case, hairlines; the game art and real products do the decorating.
   EN / 中文 via the toggle (remembered per device, defaults to the phone language). Light page, locked (house rule). */
:root{
  color-scheme:light only;
  --paper:#f4f3ef; --card:#fff; --ink:#111318; --sub:#6b6e75; --faint:#a5a7ad; --line:#dedbd3; --night:#0d1626; --night2:#16233a;
  --ice:#a9d4f5; --ice-ink:#1d5e8f; --live:#2fd16b; --up:#15803d; --you:#eef6fd;
  --sans:"Archivo","Noto Sans HK",-apple-system,"Helvetica Neue",Arial,"PingFang HK","Microsoft JhengHei",sans-serif;
  --hk:"Noto Sans HK","PingFang HK","Microsoft JhengHei","Archivo",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html[lang="zh-HK"] body{font-family:var(--hk)}
.num{font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum","lnum"}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
.page{max-width:560px;margin:0 auto;background:var(--paper);min-height:100vh}

/* hero */
.hero{position:relative;height:min(112vw,500px);overflow:hidden;background:var(--night);color:#fff}
.hero .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,22,38,.35) 0,rgba(13,22,38,0) 22%,rgba(13,22,38,.12) 44%,rgba(13,22,38,.78) 70%,var(--night) 100%)}
#snow{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.htop{position:absolute;left:20px;right:20px;top:18px;z-index:2;display:flex;justify-content:space-between;align-items:center}
.htop img{height:22px;width:auto;display:block;filter:drop-shadow(0 1px 6px rgba(0,0,0,.25))}
.lang{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;background:rgba(13,22,38,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:6px;padding:6px 10px}
.lang button{color:rgba(255,255,255,.55);padding:1px 0;border-bottom:2px solid transparent;font-family:var(--sans)}
.lang button.on{color:#fff;border-bottom-color:#fff}
.lang span{color:rgba(255,255,255,.35);font-weight:400}
.htxt{position:absolute;left:20px;right:20px;bottom:20px;z-index:2}
.status{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:rgba(255,255,255,.88)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(47,209,107,.6);animation:beat 2s ease-out infinite;flex:none}
.dot.off{background:#9aa3b2;animation:none}
.dot.fin{background:var(--ice);animation:none}
@keyframes beat{70%{box-shadow:0 0 0 8px rgba(47,209,107,0)}100%{box-shadow:0 0 0 0 rgba(47,209,107,0)}}
.kicker{margin:16px 0 0;font-size:14px;font-weight:600;letter-spacing:.01em;color:rgba(255,255,255,.82)}
.kicker b{font-weight:700;color:#fff;text-shadow:0 0 14px rgba(169,212,245,.9)}
h1{margin:4px 0 0;font-size:clamp(40px,11.5vw,54px);line-height:.95;font-weight:800;font-stretch:112%;letter-spacing:-.018em}
html[lang="zh-HK"] h1{font-family:var(--hk);font-weight:900;letter-spacing:.01em;font-stretch:normal}
.cdl{margin:12px 0 0;font-size:15px;font-weight:500;color:rgba(255,255,255,.85)}
.cdl b{font-weight:700;color:#fff}

/* leader band continues the night of the hero */
.band{background:var(--night);color:#fff;padding:0 20px 22px}
.lead{border-top:1px solid rgba(255,255,255,.14);padding-top:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:end}
.lead .tag{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--ice);display:flex;align-items:center;gap:8px}
.lead .rk{font-size:92px;line-height:.78;font-weight:800;font-stretch:118%;color:#fff;letter-spacing:-.04em}
.lead .who{min-width:0}
.lead .h{font-size:19px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.lead .s{font-size:52px;line-height:1;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.lead .m{grid-column:1/-1;display:flex;gap:14px;font-size:13px;color:rgba(255,255,255,.72);margin-top:10px}
.lead .m span+span{padding-left:14px;border-left:1px solid rgba(255,255,255,.2)}
.ck{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--up)}
.band .ck{color:#7ee2a6}
.ck svg{width:14px;height:14px;flex:none}
.pre .big{font-size:30px;font-weight:800;font-stretch:108%;letter-spacing:-.01em;margin-top:2px}
html[lang="zh-HK"] .pre .big{font-family:var(--hk);font-weight:900}
.digits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:rgba(255,255,255,.14);margin-top:16px;border-radius:8px;overflow:hidden}
.digits div{background:var(--night2);padding:12px 12px 10px}
.digits b{display:block;font-size:42px;line-height:1;font-weight:800;letter-spacing:-.02em}
.digits span{font-size:12.5px;color:rgba(255,255,255,.6)}

main{padding:0 16px 30px}
.note{margin:14px 0 0;background:#fff4c7;color:#5d4b00;border-radius:6px;padding:9px 12px;font-size:13px;font-weight:600}
.lab{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:28px 4px 10px;border-bottom:1.5px solid var(--ink);padding-bottom:7px}
.lab h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.005em}
.lab span{font-size:13px;color:var(--sub);text-align:right}

/* runners-up */
.runs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.run{background:var(--card);border-radius:8px;padding:12px 14px;min-width:0;position:relative}
.run .rk{font-size:15px;font-weight:800;color:var(--faint)}
.run .tag{font-size:12px;font-weight:700;color:var(--ice-ink)}
.run .h{font-size:15px;font-weight:700;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
.run .s{font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.015em;margin-top:2px}
.run .g{font-size:12.5px;color:var(--sub);margin-top:2px}
.run.empty .h,.run.empty .s{color:var(--faint)}

/* prize */
.prize{background:var(--card);border-radius:8px;margin-top:10px;padding:14px 14px 12px}
.prize .t{font-size:14px;font-weight:800}
.prize .d{font-size:13px;color:var(--sub);margin-top:2px}
.prize .it{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.prize figure{margin:0;text-align:center}
.prize img{width:100%;aspect-ratio:1;object-fit:contain;display:block;mix-blend-mode:multiply}
.prize figcaption{font-size:12px;color:var(--sub);margin-top:2px}

/* find + table */
.find{display:flex;align-items:center;gap:10px;margin-top:20px;border-bottom:1px solid var(--line);padding:0 4px 8px}
.find svg{width:18px;height:18px;flex:none;color:var(--sub)}
.find input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:500 16px var(--sans);color:var(--ink)}
html[lang="zh-HK"] .find input{font-family:var(--hk)}
.find input::placeholder{color:var(--faint)}
.me{margin-top:10px;background:var(--night);color:#fff;border-radius:8px;padding:12px 14px;display:flex;gap:14px;align-items:center}
.me b{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em;min-width:46px}
.me div{font-size:13.5px;line-height:1.35}
.me small{display:block;color:rgba(255,255,255,.65);font-size:12.5px;margin-top:2px}
.tbl{background:var(--card);border-radius:8px;margin-top:12px;overflow:hidden}
.th,.row{display:grid;grid-template-columns:30px 32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:0 14px}
.th{height:36px;font-size:12px;font-weight:600;color:var(--sub);border-bottom:1px solid var(--line)}
.th span:nth-child(4){text-align:right}
.row{min-height:56px;border-bottom:1px solid #eeece6;transition:background .6s}
.row:last-of-type{border-bottom:0}
.row .r{font-size:16px;font-weight:700;display:flex;flex-direction:column;line-height:1.05}
.row .r .mv{font-size:10px;margin-top:3px;font-family:var(--sans)}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.row .p{min-width:0}
.row .hn{font-size:15px;font-weight:600;display:flex;align-items:center;gap:5px;min-width:0}
.row .hn em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .hn svg{width:14px;height:14px;flex:none;color:var(--up)}
.row .tr{font-size:12px;color:var(--sub)}
.row .sc{font-size:17px;font-weight:800;text-align:right;line-height:1.15}
.row .sc small{display:block;font-size:12px;font-weight:500;color:var(--sub)}
.mv{font-size:11px;font-weight:700;flex:none}
.mv.up{color:var(--up)}.mv.dn{color:var(--faint)}.mv.nw{color:var(--ice-ink)}
.row.you{background:var(--you)}
.row.flash{background:#fff6d1}
.gapline{height:10px;border-bottom:1px dashed var(--line);margin:0 14px}
.more{display:block;width:100%;padding:13px;font-size:14px;font-weight:700;border-top:1px solid #eeece6;text-align:center}
.none{padding:22px 16px;text-align:center;color:var(--sub);font-size:14px}

/* weekly beanie */
.weeks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wk{background:var(--card);border-radius:8px;overflow:hidden;min-width:0;border-top:3px solid transparent}
.wk.now{border-top-color:var(--ink)}
.wk img{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:#fff;padding:6px}
.wk .b{padding:4px 10px 12px}
.wk .tag{font-size:11.5px;font-weight:700;color:var(--ice-ink);height:16px}
.wk .w{font-size:15px;font-weight:800}
.wk .d{font-size:12px;color:var(--sub)}
.wk .c{font-size:13px;font-weight:700;margin-top:8px}
.wk ol{margin:4px 0 0;padding-left:16px;font-size:12px;font-weight:600;line-height:1.35}
.wk ol li{overflow-wrap:anywhere}

/* how to */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.step img{width:100%;aspect-ratio:9/13;object-fit:cover;object-position:top;display:block;border-radius:10px;border:1px solid var(--line);background:#fff}
.step p{margin:8px 2px 0;font-size:13px;font-weight:600;line-height:1.3;display:flex;gap:6px}
.step p b{font-weight:800;color:var(--faint)}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;background:var(--ink);color:#fff;text-decoration:none;font-size:17px;font-weight:700;height:54px;border-radius:8px}
.cta svg{width:18px;height:18px}
.tags{margin:10px 4px 0;font-size:13px;color:var(--sub);text-align:center}
.rules{margin:22px 4px 0;font-size:13px;color:var(--sub);line-height:1.55}
footer{margin:22px 4px 0;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12.5px;color:var(--sub)}
footer img{height:16px;width:auto;display:block;opacity:.85}
footer .r{text-align:right}
@media (max-width:360px){.lead .s{font-size:44px}.lead .rk{font-size:78px}.th,.row{grid-template-columns:26px 28px minmax(0,1fr) auto;gap:8px;padding:0 10px}}
@media (prefers-reduced-motion:reduce){#snow{display:none}.dot{animation:none}}
</style>
</head>

      <div class="status" id="status"><i class="dot off"></i><span></span></div>

  <div class="band" id="band"></div>

    <a class="cta" id="play" href="https://mlbwhitechristmas26.vercel.app/" target="_blank" rel="noopener"><span data-t="play"></span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10h11M11 5l5 5-5 5"/></svg></a>
    <p class="tags" data-t="tags"></p>
    <p class="rules" data-t="rules"></p>
    <footer><img src="img/mlb_black.png" alt="MLB"><div class="r"><span id="upd"></span> <span id="tnc"></span></div></footer>
  </main>
</div>

  })();
  function t(k, v){ var s = (T[LANG][k] != null ? T[LANG][k] : T.en[k]) || ''; if (v) for (var x in v) s = s.split('{' + x + '}').join(v[x]); return s; }

  var SHOW = 10, board = null, showAll = false, lastErr = 0, prevRanks = null;
  var $ = function(id){ return document.getElementById(id); };
  function el(tag, cls, txt){ var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function fmt(n){ return Number(n).toLocaleString('en-US'); }
  function nowMs(){ if (MODE === 'demo') return Date.parse(DEMO_NOW[Q.get('demo')] || DEMO_NOW.live); return MODE === 'practice' && board && board._now ? board._now : Date.now(); }
  function hkParts(ms){ var d = new Date(ms + 8 * 36e5); return { y:d.getUTCFullYear(), mo:d.getUTCMonth() + 1, d:d.getUTCDate(), wd:d.getUTCDay(), h:('0' + d.getUTCHours()).slice(-2), mi:('0' + d.getUTCMinutes()).slice(-2) }; }
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], WDZ = ['日','一','二','三','四','五','六'];
  function dDate(ms){ var p = hkParts(ms); return LANG === 'zh' ? p.mo + ' 月 ' + p.d + ' 日' : p.d + ' ' + MON[p.mo - 1]; }
  function dDay(ms){ var p = hkParts(ms); return LANG === 'zh' ? p.mo + ' 月 ' + p.d + ' 日（' + WDZ[p.wd] + '）' : WD[p.wd] + ' ' + p.d + ' ' + MON[p.mo - 1]; }
  function dTime(ms){ var p = hkParts(ms); return p.h + ':' + p.mi; }
  function dShort(ms){ var p = hkParts(ms); return LANG === 'zh' ? p.mo + '/' + p.d : p.d + ' ' + MON[p.mo - 1]; }
  function dShortDay(ms){ var p = hkParts(ms); return LANG === 'zh' ? p.mo + '/' + p.d : WD[p.wd] + ' ' + p.d + ' ' + MON[p.mo - 1]; }
  function iso(dstr){ return Date.parse(dstr + 'T12:00:00+08:00'); }
  var CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
  var TINTS = [['#dcebf7','#1d5e8f'],['#f6e1e7','#9b2c4e'],['#ece5d8','#6b5534'],['#dff0e6','#22663d'],['#e7e3f3','#4b3d8f'],['#e8e8e4','#45474d']];
  function avatar(h){ var n = 0; for (var i = 0; i < h.length; i++) n = (n * 31 + h.charCodeAt(i)) >>> 0; var c = TINTS[n % TINTS.length]; var a = el('div', 'av', (h.replace(/[^a-z0-9]/gi, '')[0] || '?').toUpperCase()); a.style.background = c[0]; a.style.color = c[1]; return a; }
  function checked(){ var s = el('span', 'ck'); s.innerHTML = CHECK; s.appendChild(document.createTextNode(t('checked'))); return s; }

  try { prevRanks = JSON.parse(localStorage.getItem('wx_seen_ranks') || 'null'); } catch (e) { prevRanks = null; }

  function phaseOf(b){
    if (b && b.looks && b.looks.length) return 'final';
    var now = nowMs();
    if (now < Date.parse(CFG.start)) return 'pre';
    if (now > Date.parse(CFG.end)) return 'closed';
    return 'live';
  }

  function demoBoard(){
    var kind = Q.get('demo') || 'live', race = [], s = 18420, seed = 7;
    function rnd(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (var i = 0; i < 46; i++) { race.push({ r:i + 1, h:'demo_player' + (i < 9 ? '0' : '') + (i + 1), s:s, n:1 + Math.floor(rnd() * 6), v:i < 6 || rnd() > .7 }); s -= 120 + Math.floor(rnd() * 420); }
    var b = { v:1, updated:new Date(nowMs() - 4 * 6e4).toISOString(), race:race, players:race.length, entries:212,
      weeks:[{w:'W1',pool:86,winners:['demo_player07','demo_player21','demo_player33']},{w:'W2',pool:64,winners:[]},{w:'W3',pool:0,winners:[]}], looks:null };
    if (kind === 'pre') { b.race = []; b.players = 0; b.entries = 0; b.weeks = []; }
    if (kind === 'final') { b.looks = race.slice(0, 3).map(function(x){ return { h:x.h, s:x.s }; }); b.weeks[1].winners = ['demo_player12','demo_player28','demo_player40']; b.weeks[2] = {w:'W3',pool:71,winners:['demo_player05','demo_player17','demo_player39']}; }
    return b;
  }
  function load(){
    if (MODE === 'demo') return Promise.resolve(demoBoard());
    if (MODE === 'practice') { var b = null; try { b = JSON.parse(localStorage.getItem('wx_practice_board') || 'null'); } catch (e) {} return Promise.resolve(b || { race:[], weeks:[], updated:null }); }
    return fetch('board.json?t=' + Date.now(), { cache:'no-store' }).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  function statusLine(ph){
    var st = $('status'); st.textContent = '';
    var d = el('i', 'dot' + (ph === 'live' ? '' : ph === 'pre' ? ' off' : ' fin')), txt;
    if (ph === 'live') txt = t('live') + (board && board.updated ? ' — ' + t('upd1', { t:dTime(Date.parse(board.updated)) }) : '');
    else txt = ph === 'pre' ? t('opens') : ph === 'final' ? t('fin') : t('closed');
    if (Date.now() - lastErr < 90e3 && MODE === 'live') { d.className = 'dot off'; txt = t('recon'); }
    st.appendChild(d); st.appendChild(el('span', null, txt));
  }
  function countdown(){
    var ph = phaseOf(board), cd = $('cd');
    var left = (ph === 'pre' ? Date.parse(CFG.start) : Date.parse(CFG.end)) - nowMs();
    var d = Math.max(0, Math.floor(left / 864e5)), h = ('0' + Math.max(0, Math.floor(left % 864e5 / 36e5))).slice(-2), m = ('0' + Math.max(0, Math.floor(left % 36e5 / 6e4))).slice(-2);
    if (ph === 'pre' || ph === 'live') cd.innerHTML = t(ph === 'pre' ? 'opensIn' : 'endsIn', { d:'<span class="num">' + d + '</span>', h:'<span class="num">' + h + '</span>', m:'<span class="num">' + m + '</span>' });
    else cd.textContent = ph === 'final' ? t('finalL') : t('closedL');
    var dg = document.querySelectorAll('.digits b'); if (dg.length === 3) { dg[0].textContent = d; dg[1].textContent = h; dg[2].textContent = m; }
  }

  function bandView(race, ph){
    var band = $('band'); band.textContent = '';
    if (ph === 'pre' && !race.length) {
      var p = el('div', 'lead pre'); var w = el('div', 'who'); w.style.gridColumn = '1/-1';
      w.appendChild(el('div', 'tag', t('opensBig'))); w.appendChild(el('div', 'big', t('opensDate')));
      var dg = el('div', 'digits'); [t('days'), t('hours'), t('mins')].forEach(function(u){ var x = el('div'); x.appendChild(el('b', 'num', '–')); x.appendChild(el('span', null, u)); dg.appendChild(x); });
      w.appendChild(dg); p.appendChild(w); band.appendChild(p); return;
    }
    var x = race[0], L = el('div', 'lead'); L.setAttribute('data-rank', '1');
    var tag = el('div', 'tag', ph === 'final' ? t('winner') : t('leader')); L.appendChild(tag);
    L.appendChild(el('div', 'rk num', '1'));
    var who = el('div', 'who');
    var h = el('div', 'h'); h.appendChild(el('span', 'hn', x ? '@' + x.h : t('waiting'))); if (x && x.v) h.appendChild(checked()); who.appendChild(h);
    who.appendChild(el('div', 's num', x ? fmt(x.s) : '—'));
    L.appendChild(who);
    if (x) { var m = el('div', 'm'); m.appendChild(el('span', null, t('cleared'))); m.appendChild(el('span', null, x.n === 1 ? t('t1') : t('tn', { n:x.n }))); L.appendChild(m); }
    band.appendChild(L);
  }
  function runsView(race, ph){
    var box = $('runs'); box.textContent = '';
    if (ph === 'pre' && !race.length) return;
    var g = el('div', 'runs');
    [race[1], race[2]].forEach(function(x, i){
      var c = el('div', 'run' + (x ? '' : ' empty')); c.setAttribute('data-rank', String(i + 2));
      var top = el('div'); top.style.display = 'flex'; top.style.justifyContent = 'space-between';
      top.appendChild(el('span', 'rk num', String(i + 2))); top.appendChild(el('span', 'tag', ph === 'final' && x ? t('winner') : (i ? t('third') : t('second')))); c.appendChild(top);
      var h = el('div', 'h'); h.appendChild(el('span', 'hn', x ? '@' + x.h : t('slot'))); if (x && x.v) h.appendChild(checked()); c.appendChild(h);
      c.appendChild(el('div', 's num', x ? fmt(x.s) : '—'));
      c.appendChild(el('div', 'g', x ? t('behind', { g:fmt(race[0].s - x.s) }) + ' · ' + (x.n === 1 ? t('t1') : t('tn', { n:x.n })) : ''));
      g.appendChild(c);
    });
    box.appendChild(g);
  }

  function move(h, r){
    if (!prevRanks) return null; var p = prevRanks[h];
    if (p == null) return el('span', 'mv nw', t('newM'));
    if (p > r) return el('span', 'mv up', '▲' + (p - r));
    if (p < r) return el('span', 'mv dn', '▼' + (r - p));
    return null;
  }
  function row(x, top, you){
    var r = el('div', 'row' + (you ? ' you' : '')); r.setAttribute('data-h', x.h);
    var rc = el('div', 'r num', String(x.r)), mv = move(x.h, x.r); if (mv) rc.appendChild(mv);
    r.appendChild(rc);
    r.appendChild(avatar(x.h));
    var p = el('div', 'p'), hn = el('div', 'hn'); hn.appendChild(el('em', null, '@' + x.h));
    if (x.v) { var s = el('span'); s.innerHTML = CHECK; hn.appendChild(s.firstChild); }
    p.appendChild(hn); p.appendChild(el('div', 'tr', x.n === 1 ? t('t1') : t('tn', { n:x.n }))); r.appendChild(p);
    var sc = el('div', 'sc num', fmt(x.s)); if (x.r > 1) sc.appendChild(el('small', null, '−' + fmt(top - x.s))); r.appendChild(sc);
    return r;
  }
  function norm(s){ return String(s || '').toLowerCase().replace(/^@+/, '').replace(/\s+/g, ''); }
  function boardView(race, ph){
    var box = $('board'); box.textContent = '';
    if (ph === 'pre' && !race.length) return;
    var f = el('div', 'find'); f.innerHTML = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5" stroke-linecap="round"/></svg>';
    var inp = el('input'); inp.type = 'search'; inp.id = 'q'; inp.placeholder = t('find'); inp.autocomplete = 'off'; inp.autocapitalize = 'off'; inp.spellcheck = false;
    try { inp.value = sessionStorage.getItem('wx_q') || ''; } catch (e) {}
    f.appendChild(inp); box.appendChild(f);
    var me = el('div', 'me'); me.id = 'me'; me.hidden = true; box.appendChild(me);
    var tb = el('div', 'tbl'); tb.id = 'list'; box.appendChild(tb);
    inp.addEventListener('input', function(){ try { sessionStorage.setItem('wx_q', inp.value); } catch (e) {} listView(); });
    listView();
  }
  function listView(){
    var tb = $('list'); if (!tb) return;
    var race = (board && board.race) || [], q = norm(($('q') || {}).value), me = $('me'), top = race.length ? race[0].s : 0;
    tb.textContent = '';
    var th = el('div', 'th'); ['hRank', '', 'hPlayer', 'hScore'].forEach(function(k){ th.appendChild(el('span', null, k ? t(k) : '')); }); tb.appendChild(th);
    var hit = q ? race.filter(function(x){ return x.h === q; })[0] || race.filter(function(x){ return x.h.indexOf(q) >= 0; })[0] : null;
    var rest = race.slice(3), n = showAll ? rest.length : Math.min(rest.length, SHOW - 3);
    if (!race.length) tb.appendChild(el('div', 'none', t('none')));
    else if (!rest.length) tb.appendChild(el('div', 'none', t('few', { n:race.length })));
    rest.slice(0, n).forEach(function(x){ tb.appendChild(row(x, top, hit && hit.h === x.h)); });
    if (hit && hit.r > n + 3) { tb.appendChild(el('div', 'gapline')); tb.appendChild(row(hit, top, true)); }
    if (!showAll && rest.length > n) { var mb = el('button', 'more', t('all', { n:race.length })); mb.type = 'button'; mb.addEventListener('click', function(){ showAll = true; listView(); }); tb.appendChild(mb); }
    me.hidden = !q; me.textContent = '';
    if (q) {
      if (hit) { me.appendChild(el('b', 'num', '#' + hit.r)); var d = el('div'); d.appendChild(document.createTextNode(t('meRank', { h:hit.h }))); d.appendChild(el('small', null, t('meRankS', { s:fmt(hit.s), tr:hit.n === 1 ? t('t1') : t('tn', { n:hit.n }) }) + (hit.v ? ' · ' + t('checked') : ''))); me.appendChild(d); }
      else { me.appendChild(el('b', null, '—')); var d2 = el('div'); d2.appendChild(document.createTextNode(t('meNot'))); d2.appendChild(el('small', null, t('meNotS'))); me.appendChild(d2); }
    }
  }
  function weeksView(b){
    var box = $('weeks'); box.textContent = '';
    var now = nowMs();
    CFG.weeks.forEach(function(w, i){
      var info = (b.weeks || []).filter(function(x){ return x.w === w.w; })[0] || {};
      var from = Date.parse(w.from + 'T00:00:00+08:00'), to = Date.parse(w.to + 'T23:59:59+08:00'), isNow = now >= from && now <= to;
      var c = el('div', 'wk' + (isNow ? ' now' : ''));
      var img = el('img'); img.src = BEANIE[w.w]; img.alt = ''; img.loading = 'lazy'; c.appendChild(img);
      var bd = el('div', 'b');
      bd.appendChild(el('div', 'tag', isNow ? t('now') : ''));
      bd.appendChild(el('div', 'w', t('week', { n:i + 1 })));
      bd.appendChild(el('div', 'd', dShort(iso(w.from)) + ' – ' + dShort(iso(w.to))));
      var winners = info.winners || [];
      if (winners.length) { bd.appendChild(el('div', 'c', t('winners'))); var ol = el('ol'); winners.forEach(function(h){ ol.appendChild(el('li', null, '@' + h)); }); bd.appendChild(ol); }
      else { bd.appendChild(el('div', 'c', info.pool ? t('entered', { n:fmt(info.pool) }) : t('three'))); bd.appendChild(el('div', 'd', t('out', { d:dShortDay(iso(w.draw)) }))); }
      c.appendChild(bd); box.appendChild(c);
    });
  }

  function render(){
    var b = board || { race:[], weeks:[] };
    if (b.cfg) { ['start','end','game','tnc'].forEach(function(k){ if (b.cfg[k] != null) CFG[k] = b.cfg[k]; }); if (b.cfg.weeks) CFG.weeks = b.cfg.weeks; }
    var ph = phaseOf(b), race = b.race || [];
    document.documentElement.lang = LANG === 'zh' ? 'zh-HK' : 'en';
    Array.prototype.forEach.call(document.querySelectorAll('.lang button'), function(x){ x.className = x.getAttribute('data-lang') === LANG ? 'on' : ''; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function(x){ x.textContent = t(x.getAttribute('data-t')); });
    $('title').textContent = t('title');
    $('note').textContent = ''; if (MODE !== 'live') $('note').appendChild(el('div', 'note', MODE === 'demo' ? t('demo') : t('practice')));
    statusLine(ph); bandView(race, ph); runsView(race, ph); boardView(race, ph); weeksView(b); countdown();
    var u = b.updated ? Date.parse(b.updated) : null;
    $('upd').textContent = u ? t('upd', { t:dDate(u) + ', ' + dTime(u) }) : t('updNone');
    var tn = $('tnc'); tn.textContent = ''; if (CFG.tnc) { var a = el('a', null, t('tnc')); a.href = CFG.tnc; a.target = '_blank'; a.rel = 'noopener'; tn.appendChild(a); }
    $('play').href = CFG.game + (CFG.game.indexOf('?') < 0 ? '?' : '&') + 'utm_source=scoreboard&utm_medium=web&utm_campaign=whitechristmas';
  }
  function flashChanged(oldB){
    if (!oldB || !board) return;
    var was = {}; (oldB.race || []).forEach(function(x){ was[x.h] = x.r + ':' + x.s; });
    Array.prototype.forEach.call(document.querySelectorAll('.row[data-h]'), function(r){
      var x = (board.race || []).filter(function(y){ return y.h === r.getAttribute('data-h'); })[0];
      if (x && was[x.h] !== x.r + ':' + x.s) { r.classList.add('flash'); setTimeout(function(){ r.classList.remove('flash'); }, 1600); }
    });
  }
  function refresh(){
    load().then(function(b){
      var old = board, same = old && JSON.stringify(old) === JSON.stringify(b);
      board = b; lastErr = 0;
      if (!same) { render(); flashChanged(old); } else { statusLine(phaseOf(board)); countdown(); }
      setTimeout(function(){ try { var m = {}; (board.race || []).forEach(function(x){ m[x.h] = x.r; }); if (MODE === 'live') localStorage.setItem('wx_seen_ranks', JSON.stringify(m)); } catch (e) {} }, 8000);
    }).catch(function(){ lastErr = Date.now(); if (!board) render(); else statusLine(phaseOf(board)); });
  }
  document.querySelector('.lang').addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-lang]'); if (!b) return;
    LANG = b.getAttribute('data-lang'); try { localStorage.setItem('wx_lang', LANG); } catch (e) {}
    render();
  });

  // snow over the hero (paused when the tab is hidden; off for reduced motion)
  (function(){
    var c = $('snow'); if (!c || !c.getContext || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var x = c.getContext('2d'), W, H, dpr = Math.min(2, window.devicePixelRatio || 1), F = [];
    function size(){ W = c.clientWidth; H = c.clientHeight; c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0); }
    size(); window.addEventListener('resize', size);
    for (var i = 0; i < 70; i++) F.push({ x:Math.random() * W, y:Math.random() * H, r:.6 + Math.random() * 2, v:.25 + Math.random() * .7, o:Math.random() * 6.28, a:.35 + Math.random() * .5 });
    function tick(){
      if (document.visibilityState === 'visible') {
        x.clearRect(0, 0, W, H);
        F.forEach(function(f){ f.y += f.v; f.o += .01; f.x += Math.sin(f.o) * .3; if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; } x.globalAlpha = f.a; x.beginPath(); x.arc(f.x, f.y, f.r, 0, 6.283); x.fillStyle = '#fff'; x.fill(); });
      }
      requestAnimationFrame(tick);
    }
    tick();
  })();

  render();
  refresh();
  setInterval(refresh, MODE === 'live' ? 60000 : 4000);
  setInterval(countdown, 30000);
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') refresh(); });
})();
</script>
