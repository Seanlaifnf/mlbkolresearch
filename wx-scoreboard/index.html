<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#0d1626">
<title>MLB · Save the White Christmas · Live scoreboard</title>
<meta property="og:title" content="MLB · Save the White Christmas · Live scoreboard">
<meta property="og:description" content="Ride 10 stages, share your score card and climb the board.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Noto+Sans+HK:wght@400;500;700;900&display=swap">
<link rel="preload" as="image" href="img/hero.webp">
<style>
/* Public live scoreboard · MLB HK "Save the White Christmas". Reads board.json (written by the team console), refreshes every minute.
   Order: hero → top three (navy band) → prize → section bar → ranking → weekly beanie → how to join → rules.
   Wording follows the HK edit of the game (written Chinese / plain English). EN / 中文 toggle, remembered per device. Light page (house rule). */
:root{
  color-scheme:light only;
  --paper:#f4f3ef; --card:#fff; --ink:#111318; --sub:#6b6e75; --faint:#a5a7ad; --line:#dedbd3; --line2:#ecebe6; --night:#0d1626; --night2:#152238;
  --ice:#a9d4f5; --ice-ink:#1d5e8f; --live:#2fd16b; --up:#15803d; --you:#eef6fd;
  --sans:"Archivo","Noto Sans HK",-apple-system,"Helvetica Neue",Arial,"PingFang HK","Microsoft JhengHei",sans-serif;
  --hk:"Noto Sans HK","PingFang HK","Microsoft JhengHei","Archivo",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html[lang="zh-HK"] body{font-family:var(--hk)}
.num{font-family:"Archivo",sans-serif;font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum","lnum"}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
.page{max-width:560px;margin:0 auto;background:var(--paper);min-height:100vh;padding-bottom:84px}

/* hero */
.hero{position:relative;height:min(108vw,480px);overflow:hidden;background:var(--night);color:#fff}
.hero .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,22,38,.35) 0,rgba(13,22,38,0) 22%,rgba(13,22,38,.12) 44%,rgba(13,22,38,.8) 72%,var(--night) 100%)}
#snow{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.htop{position:absolute;left:20px;right:20px;top:18px;z-index:2;display:flex;justify-content:space-between;align-items:center}
.htop img{height:22px;width:auto;display:block;filter:drop-shadow(0 1px 6px rgba(0,0,0,.25))}
.lang{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;background:rgba(13,22,38,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:6px;padding:6px 10px}
.lang button{color:rgba(255,255,255,.55);padding:1px 0;border-bottom:2px solid transparent;font-family:var(--sans)}
.lang button.on{color:#fff;border-bottom-color:#fff}
.lang span{color:rgba(255,255,255,.35);font-weight:400}
.htxt{position:absolute;left:20px;right:20px;bottom:18px;z-index:2}
.status{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:rgba(255,255,255,.88)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(47,209,107,.6);animation:beat 2s ease-out infinite;flex:none}
.dot.off{background:#9aa3b2;animation:none}
.dot.fin{background:var(--ice);animation:none}
@keyframes beat{70%{box-shadow:0 0 0 8px rgba(47,209,107,0)}100%{box-shadow:0 0 0 0 rgba(47,209,107,0)}}
.kicker{margin:14px 0 0;font-size:14px;font-weight:600;letter-spacing:.01em;color:rgba(255,255,255,.82)}
.kicker b{font-weight:700;color:#fff;text-shadow:0 0 14px rgba(169,212,245,.9)}
h1{margin:4px 0 0;font-size:clamp(40px,11.5vw,54px);line-height:.95;font-weight:800;font-stretch:112%;letter-spacing:-.018em}
html[lang="zh-HK"] h1{font-family:var(--hk);font-weight:900;letter-spacing:.01em;font-stretch:normal}
.cdl{margin:10px 0 0;font-size:15px;font-weight:500;color:rgba(255,255,255,.85)}
.cdl b{font-weight:700;color:#fff}

/* top three — navy band continuing the hero */
.band{background:var(--night);color:#fff;padding:0 20px 22px}
.lead{border-top:1px solid rgba(255,255,255,.14);padding-top:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:end}
.lead .tag{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--ice)}
.lead .rk{font-size:92px;line-height:.78;font-weight:800;font-stretch:118%;letter-spacing:-.04em}
.lead .who{min-width:0}
.lead .h{font-size:19px;font-weight:700;overflow:hidden;white-space:nowrap;display:flex;align-items:center;gap:6px}
.lead .h .hn{overflow:hidden;text-overflow:ellipsis}
.lead .s{font-size:52px;line-height:1;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.lead .m{grid-column:1/-1;display:flex;gap:14px;font-size:13px;color:rgba(255,255,255,.72);margin-top:10px}
.lead .m span+span{padding-left:14px;border-left:1px solid rgba(255,255,255,.2)}
.runs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.run{background:var(--night2);border:1px solid rgba(255,255,255,.09);border-radius:8px;padding:12px 14px;min-width:0}
.run .top{display:flex;justify-content:space-between;align-items:baseline}
.run .rk{font-size:22px;font-weight:800;color:rgba(255,255,255,.5);line-height:1}
.run .tag{font-size:12px;font-weight:700;color:var(--ice)}
.run .h{font-size:15px;font-weight:700;margin-top:8px;overflow:hidden;white-space:nowrap;display:flex;align-items:center;gap:5px}
.run .h .hn{overflow:hidden;text-overflow:ellipsis}
.run .s{font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.015em;margin-top:2px}
.run .g{font-size:12.5px;color:rgba(255,255,255,.6);margin-top:3px}
.run.empty .h,.run.empty .s{color:rgba(255,255,255,.35)}
.ck{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#7ee2a6;flex:none}
.ck svg{width:14px;height:14px;flex:none}
.pre .big{font-size:30px;font-weight:800;font-stretch:108%;letter-spacing:-.01em;margin-top:2px}
html[lang="zh-HK"] .pre .big{font-family:var(--hk);font-weight:900}
.digits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:rgba(255,255,255,.14);margin-top:16px;border-radius:8px;overflow:hidden}
.digits div{background:var(--night2);padding:12px 12px 10px}
.digits b{display:block;font-size:42px;line-height:1;font-weight:800;letter-spacing:-.02em}
.digits span{font-size:12.5px;color:rgba(255,255,255,.6)}

/* prize */
.prize{background:var(--card);margin:0;padding:16px 20px 14px;border-bottom:1px solid var(--line)}
.prize .t{font-size:15px;font-weight:800}
.prize .d{font-size:13px;color:var(--sub);margin-top:2px}
.prize .it{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.prize figure{margin:0;text-align:center}
.prize img{width:100%;aspect-ratio:1;object-fit:contain;display:block;mix-blend-mode:multiply}
.prize figcaption{font-size:12px;color:var(--sub);margin-top:2px}

/* section bar */
.snav{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(244,243,239,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.snav a{display:block;text-align:center;text-decoration:none;font-size:14px;font-weight:700;color:var(--sub);padding:13px 4px 11px;border-bottom:2px solid transparent}
.snav a.on{color:var(--ink);border-bottom-color:var(--ink)}

main{padding:0 16px}
.note{margin:14px 0 0;background:#fff4c7;color:#5d4b00;border-radius:6px;padding:9px 12px;font-size:13px;font-weight:600}
.sec{scroll-margin-top:52px}
.lab{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:26px 4px 10px;border-bottom:1.5px solid var(--ink);padding-bottom:7px}
.lab h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.005em}
.lab span{font-size:13px;color:var(--sub);text-align:right}

/* ranking */
.tbl{background:var(--card);border-radius:8px;overflow:hidden}
.find{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.find svg{width:18px;height:18px;flex:none;color:var(--sub)}
.find input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:500 16px var(--sans);color:var(--ink)}
html[lang="zh-HK"] .find input{font-family:var(--hk)}
.find input::placeholder{color:var(--faint)}
.me{margin:0;background:var(--night);color:#fff;padding:12px 14px;display:flex;gap:14px;align-items:center}
.me b{font-size:30px;font-weight:800;line-height:1;letter-spacing:-.02em;min-width:46px}
.me div{font-size:13.5px;line-height:1.35}
.me small{display:block;color:rgba(255,255,255,.65);font-size:12.5px;margin-top:2px}
.th,.row{display:grid;grid-template-columns:30px 32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:0 14px}
.th{height:34px;font-size:12px;font-weight:600;color:var(--sub);border-bottom:1px solid var(--line2);background:#fbfaf8}
.th span:nth-child(4){text-align:right}
.row{min-height:56px;border-bottom:1px solid var(--line2);transition:background .6s}
.row .r{font-size:16px;font-weight:700;display:flex;flex-direction:column;line-height:1.05}
.row .r .mv{font-size:10px;margin-top:3px;font-family:var(--sans)}
.av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.row .p{min-width:0}
.row .hn{font-size:15px;font-weight:600;display:flex;align-items:center;gap:5px;min-width:0}
.row .hn em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .hn svg{width:14px;height:14px;flex:none;color:var(--up)}
.row .tr{font-size:12px;color:var(--sub)}
.row .sc{font-size:17px;font-weight:800;text-align:right;line-height:1.15}
.row .sc small{display:block;font-size:12px;font-weight:500;color:var(--sub)}
.mv{font-weight:700;flex:none}
.mv.up{color:var(--up)}.mv.dn{color:var(--faint)}.mv.nw{color:var(--ice-ink)}
.row.you{background:var(--you)}
.row.flash{background:#fff6d1}
.gapline{height:10px;border-bottom:1px dashed var(--line);margin:0 14px}
.more{display:block;width:100%;padding:13px;font-size:14px;font-weight:700;text-align:center}
.none{padding:24px 16px;text-align:center;color:var(--sub);font-size:14px}

/* weekly beanie */
.weeks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wk{background:var(--card);border-radius:8px;overflow:hidden;min-width:0;border-top:3px solid transparent}
.wk.now{border-top-color:var(--ink)}
.wk img{width:100%;aspect-ratio:1;object-fit:contain;display:block;background:#fff;padding:6px}
.wk .b{padding:4px 10px 12px}
.wk .tag{font-size:11.5px;font-weight:700;color:var(--ice-ink);height:16px}
.wk .w{font-size:15px;font-weight:800}
.wk .d{font-size:12px;color:var(--sub)}
.wk .c{font-size:13px;font-weight:700;margin-top:8px}
.wk ol{margin:4px 0 0;padding-left:16px;font-size:12px;font-weight:600;line-height:1.35}
.wk ol li{overflow-wrap:anywhere}

/* how to join */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.step img{width:100%;aspect-ratio:9/14;object-fit:cover;object-position:top;display:block;border-radius:10px;border:1px solid var(--line);background:#fff}
.step p{margin:8px 2px 0;font-size:13px;font-weight:600;line-height:1.3;display:flex;gap:6px}
.step p b{font-weight:800;color:var(--faint)}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;background:var(--ink);color:#fff;text-decoration:none;font-size:17px;font-weight:700;height:54px;border-radius:8px}
.cta svg{width:18px;height:18px}
.tags{margin:10px 4px 0;font-size:13px;color:var(--sub);text-align:center}

/* rules */
.rl{margin:0;background:var(--card);border-radius:8px;padding:2px 14px}
.rl div{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.rl div:last-child{border-bottom:0}
.rl dt{font-size:13.5px;font-weight:800}
.rl dd{margin:0;font-size:13.5px;color:#3d4046;line-height:1.5}
.fine{margin:10px 4px 0;font-size:13px;color:var(--sub)}
footer{margin:22px 4px 0;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12.5px;color:var(--sub)}
footer img{height:16px;width:auto;display:block;opacity:.85}
footer .r{text-align:right}

/* bottom start bar */
.dock{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);width:min(528px,calc(100% - 32px));z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:#fff;text-decoration:none;border-radius:10px;padding:0 18px;height:54px;box-shadow:0 10px 30px rgba(13,22,38,.28);transition:transform .3s ease}
.dock.on{transform:translate(-50%,0)}
.dock span{font-size:16px;font-weight:700}
.dock small{font-size:12.5px;color:rgba(255,255,255,.65);font-weight:500;margin-left:8px}
.dock svg{width:18px;height:18px;flex:none}
@media (max-width:360px){.lead .s{font-size:44px}.lead .rk{font-size:78px}.th,.row{grid-template-columns:26px 28px minmax(0,1fr) auto;gap:8px;padding:0 10px}.rl div{grid-template-columns:92px minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){#snow{display:none}.dot{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="page">
  <header class="hero" id="hero">
    <img class="art" src="img/hero.webp" alt="">
    <canvas id="snow" aria-hidden="true"></canvas>
    <div class="htop"><img src="img/mlb_white.png" alt="MLB"><div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><span>/</span><button type="button" data-lang="zh">中文</button></div></div>
    <div class="htxt">
      <div class="status" id="status"><i class="dot off"></i><span></span></div>
      <p class="kicker">Save the <b>White</b> Christmas</p>
      <h1 id="title"></h1>
      <p class="cdl" id="cd"></p>
    </div>
  </header>
  <section class="band" id="band"></section>
  <section class="prize"><div class="t" data-t="prizeH"></div><div class="d" data-t="prizeS"></div>
    <div class="it"><figure><img src="img/p_beanie.webp" alt="" loading="lazy"><figcaption data-t="pBeanie"></figcaption></figure><figure><img src="img/p_charm.webp" alt="" loading="lazy"><figcaption data-t="pCharm"></figcaption></figure><figure><img src="img/p_top.webp" alt="" loading="lazy"><figcaption data-t="pTop"></figcaption></figure><figure><img src="img/p_bottom.webp" alt="" loading="lazy"><figcaption data-t="pBottom"></figcaption></figure></div>
  </section>
  <nav class="snav" id="snav"><a href="#rank" data-t="navRank"></a><a href="#weekly" data-t="navWeek"></a><a href="#join" data-t="navJoin"></a></nav>
  <main>
    <div id="note"></div>
    <section class="sec" id="rank">
      <div class="lab"><h2 data-t="rankH"></h2><span id="rankMeta"></span></div>
      <div id="board"></div>
    </section>
    <section class="sec" id="weekly">
      <div class="lab"><h2 data-t="weekH"></h2><span data-t="weekS"></span></div>
      <div class="weeks" id="weeks"></div>
    </section>
    <section class="sec" id="join">
      <div class="lab"><h2 data-t="howH"></h2><span></span></div>
      <div class="steps">
        <div class="step"><img data-shot="s_title" alt="" loading="lazy"><p><b>1</b><span data-t="s1"></span></p></div>
        <div class="step"><img data-shot="s_play" alt="" loading="lazy"><p><b>2</b><span data-t="s2"></span></p></div>
        <div class="step"><img data-shot="s_result" alt="" loading="lazy"><p><b>3</b><span data-t="s3"></span></p></div>
      </div>
      <a class="cta play" href="#" target="_blank" rel="noopener"><span data-t="play"></span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10h11M11 5l5 5-5 5"/></svg></a>
      <p class="tags" data-t="tags"></p>
    </section>
    <section class="sec" id="rules">
      <div class="lab"><h2 data-t="rulesH"></h2><span></span></div>
      <dl class="rl"><div><dt data-t="r1t"></dt><dd data-t="r1"></dd></div><div><dt data-t="r2t"></dt><dd data-t="r2"></dd></div><div><dt data-t="r3t"></dt><dd data-t="r3"></dd></div></dl>
      <p class="fine" data-t="fine"></p>
    </section>
    <footer><img src="img/mlb_black.png" alt="MLB"><div class="r"><span id="upd"></span> <span id="tnc"></span></div></footer>
  </main>
  <a class="dock play" id="dock" href="#" target="_blank" rel="noopener"><div><span data-t="play"></span><small data-t="dockS"></small></div><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10h11M11 5l5 5-5 5"/></svg></a>
</div>

    size(); window.addEventListener('resize', size);
    for (var i = 0; i < 70; i++) F.push({ x:Math.random() * W, y:Math.random() * H, r:.6 + Math.random() * 2, v:.25 + Math.random() * .7, o:Math.random() * 6.28, a:.35 + Math.random() * .5 });
    function tick(){
      if (document.visibilityState === 'visible') {
        x.clearRect(0, 0, W, H);
        F.forEach(function(f){ f.y += f.v; f.o += .01; f.x += Math.sin(f.o) * .3; if (f.y > H + 4) { f.y = -4; f.x = Math.random() * W; } x.globalAlpha = f.a; x.beginPath(); x.arc(f.x, f.y, f.r, 0, 6.283); x.fillStyle = '#fff'; x.fill(); });
      }
      requestAnimationFrame(tick);
    }
    tick();
  })();

  render();
  refresh();
  setInterval(refresh, MODE === 'live' ? 60000 : 4000);
  setInterval(countdown, 30000);
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') refresh(); });
})();
